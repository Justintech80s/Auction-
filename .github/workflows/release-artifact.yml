name: Release Artifact

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Auction-Browser-Extension-v1.0.0.zip'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install production dependencies
        run: npm install --omit=dev
      - name: Run full tests
        run: npm test
      - name: Build self-contained extension
        run: npm run build:extension
      - name: Package flat easy-install ZIP
        run: |
          rm -f Auction-Browser-Extension-v1.0.0.zip
          cd dist/auction-extension
          zip -r ../../Auction-Browser-Extension-v1.0.0.zip .
      - name: Verify easy-install ZIP root and integrity
        run: |
          python - <<'PY'
          import json
          import zipfile

          path = 'Auction-Browser-Extension-v1.0.0.zip'
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              if 'manifest.json' not in names:
                  raise SystemExit('manifest.json is not at ZIP root')
              if any(name.startswith('auction-extension/') for name in names):
                  raise SystemExit('ZIP still contains a nested auction-extension directory')
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'ZIP integrity failed at {bad}')
              manifest = json.loads(archive.read('manifest.json'))
              if manifest.get('manifest_version') != 3:
                  raise SystemExit('manifest_version is not 3')
              if manifest.get('version') != '1.0.0':
                  raise SystemExit('extension version is not 1.0.0')
          print('ZIP root and integrity verified')
          PY
      - name: Upload easy-install extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auction-Browser-Extension-v1.0.0
          path: Auction-Browser-Extension-v1.0.0.zip
          if-no-files-found: error
      - name: Publish easy-install ZIP to main
        run: |
          if git diff --quiet -- Auction-Browser-Extension-v1.0.0.zip; then
            echo "Release ZIP already matches the build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Auction-Browser-Extension-v1.0.0.zip
          git commit -m "build: refresh Auction browser extension release zip"
          git push
