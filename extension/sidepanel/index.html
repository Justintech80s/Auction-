<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auction</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./shared-results.css"></head><body class="auction-photo-body"><main class="panel-shell photo-shell" aria-live="polite">
<header class="website-header"><h1>Auction</h1><p>Upload a product image to find the cheapest price online</p></header>
<section id="photo-upload-card" class="website-card upload-card"><input id="photo-input" type="file" accept="image/png,image/jpeg,image/webp" hidden><button id="photo-dropzone" class="photo-dropzone" type="button"><span class="upload-icon">⇧</span><strong>Click to upload</strong><span>or drag and drop a product photo</span></button><div id="photo-preview-wrap" class="photo-preview-wrap" hidden><img id="photo-preview" alt="Selected product"><p id="photo-filename"></p></div><button id="find-price" class="website-primary" type="button" disabled>Find Cheapest Price</button><p id="upload-status" class="website-status"></p></section>
<section id="shared-scan-results" class="website-results" hidden>
<section class="website-card product-card"><h2>✓ Product Identified</h2><img id="shared-product-image" class="result-image" alt="" hidden><p class="field-label">Product</p><h3 id="shared-product-heading">Waiting for product…</h3><p class="field-label">Brand / Model</p><p id="shared-product-meta">—</p><div id="shared-product-features" class="feature-list"></div></section>
<section id="shared-lowest-price-card" class="website-card lowest-card" hidden><h2>🎉 Lowest Price Found</h2><strong id="shared-lowest-price" class="website-lowest">—</strong><p id="shared-lowest-details"></p><span id="shared-lowest-store"></span><strong id="shared-save-amount"></strong><a id="shared-lowest-link" class="visit-store" target="_blank" rel="noopener noreferrer" hidden>Visit Store</a></section>
<section class="website-card"><div class="results-heading"><h2>💰 Price Comparison</h2><span id="shared-comparison-count">0 offers</span></div><div id="shared-comparison-list" class="offer-list"><p>No verified prices yet.</p></div></section>
<section id="shared-savings-card" class="website-card" hidden><h2>💡 Savings Tips</h2><ul id="shared-savings-tips" class="savings-list"></ul></section>
</section>
<span id="panel-state" hidden>idle</span><span id="panel-title" hidden></span><span id="panel-message" hidden></span><span id="shared-current-price" hidden></span>
</main><script type="module" src="./shared-session.js"></script></body></html>
