<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Auction</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="popup-shell">
    <div class="popup-brand">
      <p class="eyebrow">AUCTION</p>
      <h1>Shopping Assistant</h1>
    </div>
    <button id="scan-product" type="button" class="primary-action">Scan This Product</button>
    <button id="open-sidebar" type="button" class="secondary-action">Open Auction Sidebar</button>

    <details class="backend-settings">
      <summary>Shared backend</summary>
      <label for="backend-endpoint">Product scan endpoint</label>
      <input id="backend-endpoint" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://your-project.vercel.app/api/product-scan">
      <button id="save-backend" type="button" class="secondary-action compact-action">Save Backend</button>
      <p class="setting-help">HTTPS only. Auction stores this URL locally in the extension and never stores provider credentials here.</p>
    </details>

    <p id="popup-status" class="status" aria-live="polite"></p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
